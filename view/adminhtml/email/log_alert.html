<!--@subject 🚨 Log Monitor: {{var error_count}} error(s) need attention on {{var store_url}} @-->
<!--@vars {"var store_url":"Store Base URL", "var hostname":"Server Hostname", "var file_size":"Combined Log Size", "var last_modified":"Last Log Write Time", "var error_count":"Alerts In This Email", "var new_count":"New Errors", "var recurring_count":"Recurring Errors", "var alerts_html|raw":"Pre-rendered Alert Rows (HTML)"} @-->
<div style="font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; border: 1px solid #e0e0e0;">
    <div style="background-color: #d84315; padding: 20px; color: white; text-align: center;">
        <h2 style="margin: 0;">🚨 Magento Log Alert</h2>
        <p style="margin: 5px 0 0 0;">{{var store_url}} &middot; server {{var hostname}}</p>
    </div>

    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f4f4f4; border-bottom: 2px solid #ccc; font-size: 14px;">
        <tr>
            <td style="padding: 15px; vertical-align: top;">
                <strong>Monitoring:</strong> <code>var/log/*.log</code><br>
                <strong>Combined Size:</strong> <span style="color: #d84315; font-weight: bold;">{{var file_size}}</span>
            </td>
            <td style="padding: 15px; vertical-align: top; text-align: right;">
                <strong>Last Written:</strong> {{var last_modified}}<br>
                <strong>New:</strong> {{var new_count}} &middot; <strong>Recurring:</strong> {{var recurring_count}}
            </td>
        </tr>
    </table>

    <div style="padding: 20px;">
        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 0;">Error Details</h3>

        {{var alerts_html|raw}}
    </div>
</div>
